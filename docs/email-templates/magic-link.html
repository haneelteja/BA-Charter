<!--
  Supabase Auth → Authentication → Emails → Templates → Magic Link
  Paste this whole file into the "Source" HTML field there and save.
  Uses Supabase's template variable {{ .ConfirmationURL }} — don't rename it.

  Written as table-based email HTML with inline styles on purpose: email
  clients (Outlook especially) ignore <style> blocks and modern CSS, so
  this can't just reuse the app's Tailwind classes.
-->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in to BA Charter</title>
  </head>
  <body style="margin:0; padding:0; background-color:#f7f7fb; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f7f7fb; padding:40px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px; width:100%;">

            <!-- Logo -->
            <tr>
              <td align="center" style="padding-bottom:24px;">
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="width:44px; height:44px; background-color:#4f46e5; border-radius:12px; text-align:center; vertical-align:middle; font-size:16px; font-weight:700; color:#ffffff; line-height:44px;">
                      BA
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Card -->
            <tr>
              <td style="background-color:#ffffff; border:1px solid #e5e5ee; border-radius:16px; padding:40px 32px; text-align:center;">
                <h1 style="margin:0 0 8px; font-size:20px; line-height:28px; font-weight:600; color:#16161d;">
                  Sign in to BA Charter
                </h1>
                <p style="margin:0 0 28px; font-size:14px; line-height:22px; color:#6b6b7b;">
                  Click the button below to sign in. This link expires shortly and can only be used once.
                </p>

                <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 auto;">
                  <tr>
                    <td style="border-radius:9999px; background-color:#4f46e5;">
                      <a
                        href="{{ .ConfirmationURL }}"
                        target="_blank"
                        style="display:inline-block; padding:12px 32px; font-size:14px; font-weight:600; color:#ffffff; text-decoration:none; border-radius:9999px;"
                      >
                        Sign in
                      </a>
                    </td>
                  </tr>
                </table>

                <p style="margin:28px 0 0; font-size:12px; line-height:18px; color:#9a9aab;">
                  Didn't request this? You can safely ignore this email — no account changes were made.
                </p>
              </td>
            </tr>

            <!-- Footer -->
            <tr>
              <td align="center" style="padding-top:24px;">
                <p style="margin:0; font-size:12px; color:#9a9aab;">
                  BA Charter — business analysis workspace
                </p>
              </td>
            </tr>

          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
